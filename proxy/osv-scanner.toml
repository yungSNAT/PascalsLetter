# OSV-Scanner reads this file for proxy/Cargo.lock only: it applies the config
# beside each lockfile. The root Cargo.lock has no ignores.

# libsqlite3-sys 0.32 bundles SQLite 3.49, which can return uninitialised
# page-cache memory when it opens a database with a -wal file whose page size
# differs. Fixed in libsqlite3-sys 0.39 (rusqlite 0.41). This lockfile cannot
# take it: icm-store at the pinned rtk-ai/icm rev links rusqlite 0.34, and icm's
# main branch is on rusqlite 0.40 (libsqlite3-sys 0.38.2, still affected).
# When icm-store reaches rusqlite 0.41, move the icm rev and proxy's rusqlite
# there and delete this entry. If the date passes first, the scan fails again
# and the entry needs a fresh look.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-13
reason = "Needs a database and -wal written by a less trusted party. rtk-proxy is not in releases (built from source only). Its stores default to <config dir>/rtk/llm-proxy, but on first start it adopts rtk-proxy.db or rtk-proxy-memory.db, with -wal, from the launch directory, and --db, --icm-db or RTK_PROXY_* can point elsewhere. Blocked on icm-store moving to rusqlite 0.41."
