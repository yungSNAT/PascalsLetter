# The fixed corpus: commands a coding agent commonly runs, on public
# repositories pinned to full commits. Each setup adds one failing test, so
# the test runs and `git status` and `git diff` show a failure and a change.
# cargo, clippy and pytest output depends on the toolchain: `published` records
# the versions beside the results.

[[repo]]
name = "ripgrep"
url = "https://github.com/BurntSushi/ripgrep"
rev = "4649aa9700619f94cf9c66876e9549d83420e16c" # 14.1.1
setup = [
  "printf '\\n#[test]\\nfn output_tokens_fails() {\\n    assert_eq!(1 + 1, 3, \"deliberate failure\");\\n}\\n' >> crates/globset/src/lib.rs",
  "cargo build --quiet",
  "cargo test --workspace --no-run --quiet",
  # Warms the cache only: current clippy denies a lint in grep-cli 14.1.1.
  "cargo clippy --workspace --quiet || true",
]

[[repo]]
name = "click"
url = "https://github.com/pallets/click"
rev = "874ca2bc1c30d93a4ac6e36a15ed685eafe89097" # 8.1.7
path = [".venv/bin"]
setup = [
  "printf '\\n\\ndef test_output_tokens_fails():\\n    assert 1 + 1 == 3, \"deliberate failure\"\\n' >> tests/test_basic.py",
  "uv venv --quiet --allow-existing .venv",
  "uv pip install --quiet --python .venv/bin/python pytest==8.3.5 -e .",
]

[[command]]
repo = "ripgrep"
run = "git log -n 20"
question = "Of the latest 20 commits, which is newest and which oldest?"
keep = ["4649aa9", "f7b677d", "deps: update everything"]

[[command]]
repo = "ripgrep"
run = "git log --stat -n 3"
question = "Which files did the last 3 commits change?"
keep = ["4649aa9", "c009652", "b9f7a9b", "Cargo.lock", "CHANGELOG.md"]

[[command]]
repo = "ripgrep"
run = "git show HEAD~2"
question = "What did the commit change?"
keep = "diff"

[[command]]
repo = "ripgrep"
run = "git diff e50df40a1967708b9781486b1c017e48040bceb0 4649aa9700619f94cf9c66876e9549d83420e16c -- crates/core"
question = "What changed in crates/core between the 2 commits?"
keep = "diff"

[[command]]
repo = "ripgrep"
run = "git status"
question = "Which files have uncommitted changes?"
keep = ["crates/globset/src/lib.rs"]

[[command]]
repo = "ripgrep"
run = "git diff"
question = "What is the uncommitted change?"
keep = "diff"

[[command]]
repo = "ripgrep"
run = "grep -rn 'fn new' crates/searcher/src"
question = "Which lines define a `new` function?"
keep = "matches"

[[command]]
repo = "ripgrep"
run = "rg -n 'unwrap\\(\\)' crates/printer/src"
question = "Which lines call `unwrap()`?"
keep = "matches"

[[command]]
repo = "ripgrep"
run = "find crates -name '*.rs'"
question = "What are the Rust files called?"
keep = "basenames"

[[command]]
repo = "ripgrep"
run = "ls -la crates/core"
question = "What is in crates/core?"
keep = ["flags", "haystack.rs", "logger.rs", "main.rs", "messages.rs", "README.md", "search.rs"]

[[command]]
repo = "ripgrep"
run = "cat crates/core/main.rs"
question = "What does crates/core/main.rs say?"
keep = "lines"

[[command]]
repo = "ripgrep"
run = "cargo build"
before = "touch crates/core/main.rs"

[[command]]
repo = "ripgrep"
run = "cargo clippy --workspace"
question = "Which errors stop clippy, and where?"
keep = ["this loop never actually loops", "crates/cli/src/decompress.rs:180:9", "written amount is not handled", "crates/printer/src/json.rs:522:9"]
before = "touch crates/core/main.rs crates/globset/src/lib.rs"

[[command]]
repo = "ripgrep"
run = "cargo test -p grep-searcher"
# Builds first, so no side's output carries the compile left by the touches above.
before = "cargo test -p grep-searcher --no-run --quiet"

[[command]]
repo = "ripgrep"
run = "cargo test --workspace"
question = "Which test fails, where and why?"
keep = ["output_tokens_fails", "crates/globset/src/lib.rs:1026:5", "deliberate failure"]
before = "cargo test --workspace --no-run --quiet"

[[command]]
repo = "click"
run = "pytest"
question = "Which test fails, and why?"
keep = ["test_output_tokens_fails", "deliberate failure"]

[[command]]
repo = "click"
run = "pytest tests/test_options.py"
question = "How many tests passed?"
keep = ["112 passed"]

[[command]]
repo = "click"
run = "git log --oneline -n 40"
question = "Which are the latest 40 commits?"
keep = "lines"

[[command]]
repo = "click"
run = "grep -n 'def ' src/click/core.py"
question = "Which functions does core.py define?"
keep = "matches"

[[command]]
repo = "click"
run = "find src -name '*.py'"
question = "What are the Python files called?"
keep = "basenames"
