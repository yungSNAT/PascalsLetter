# OSV-Scanner reads this file for the package-lock.json beside it only.
#
# picomatch is vulnerable to ReDoS through single-branch repeated extglobs
# (https://osv.dev/GHSA-fc5q-39xc-vjpf), with no fixed version as at
# 18 November 2026: 4.0.7, the latest release, is the last affected. It reaches
# this lockfile through @ooples/token-optimizer-mcp 7.11.0 ->
# @typescript-eslint/typescript-estree -> tinyglobby 0.2.17 -> picomatch, all
# their latest releases, so no lockfile update removes it. When a fixed
# picomatch is released, update the lockfile and delete this entry. If the date
# passes first, the scan fails again and the entry needs a fresh look.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-18
reason = "Only the output-tokens benchmark installs this lockfile, by hand and without install scripts, to measure a third-party plugin on its fixed command corpus. rtk never ships or calls it. No fixed picomatch exists (4.0.7 is the latest and last affected)."
