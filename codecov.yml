# Codecov reports coverage for the README badge and gates each pull request:
# every changed coverable line must be hit, and the project figure must not
# fall below the base commit's. It posts no comments.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%
comment: false
