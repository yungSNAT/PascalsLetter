name: CI

on:
  pull_request:
    branches: [develop, master]
  # Each develop commit gets a result, and only develop saves the Rust caches,
  # which every pull request then restores. A pull request's own entries could
  # be restored only by its reruns, and they filled the 10 GB cache limit.
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  # Only pull request runs are cancelled, so each push to develop keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Fast gates (fail early, save CI minutes) ───

  check-test-presence:
    timeout-minutes: 30
    name: test presence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Check filter modules have tests
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          cargo run --quiet --locked --manifest-path tools/dev/Cargo.toml -- check-test-presence "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  fmt:
    timeout-minutes: 30
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    timeout-minutes: 30
    name: clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
        # `proxy/` is not a workspace member (it would break
        # `cargo install --git`), so it gets its own job below. Here
        # --workspace covers `rtk` + `engine`; a bare `cargo clippy` would
        # never lint the daemon.
      - run: cargo clippy --workspace --all-targets

  rustdoc:
    timeout-minutes: 30
    name: rustdoc
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # clippy's cache: these dependencies are checked the same way there, so
      # this job restores it and saves no entry of its own (fewer cache keys).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: false
      - run: cargo doc --no-deps

  # ─── Parallel gates (all need code to compile) ───

  # `proxy/` is not a workspace member -- a second binary-bearing package
  # breaks `cargo install --git`, the command every README prints. So the
  # daemon gets its own lint and test job here; --workspace above covers only
  # `rtk` + `engine`.
  proxy:
    timeout-minutes: 30
    name: proxy (lint + test)
    runs-on: ubuntu-latest
    needs: clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo fmt --manifest-path proxy/Cargo.toml --all --check
      - run: cargo clippy --manifest-path proxy/Cargo.toml --all-targets
      - name: Install the pinned cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.150
          fallback: none
      - run: cargo nextest run --locked --manifest-path proxy/Cargo.toml --no-fail-fast

  # The Apache-2.0 edition. Two things must hold: it builds and passes its own
  # tests, and its dependency graph contains no BUSL crate. The purity check is
  # what stops the feature rotting -- without it the first ungated
  # `rtk_engine::` call breaks the oss build and nobody notices until a release.
  oss:
    timeout-minutes: 30
    name: oss edition (build + purity)
    runs-on: ubuntu-latest
    needs: clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install required search tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep grep
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo clippy --no-default-features --all-targets
      - name: Install the pinned cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.150
          fallback: none
      - run: cargo nextest run --locked --no-default-features --no-fail-fast
      # Match the crate-name column, not the whole line: the checkout path
      # can contain 'rtk-engine', which would match every line's path and
      # fail a clean tree.
      - name: No BUSL crate in the Apache-2.0 edition
        run: |
          crates=$(cargo tree -p rtk --no-default-features -e normal --prefix none | awk '{print $1}' | sort -u)
          if printf '%s\n' "$crates" | grep -qx 'rtk-engine'; then
            echo "::error::rtk-engine reached the Apache-2.0 edition's dependency graph"
            cargo tree -p rtk --no-default-features -e normal | grep -nE '(^|[^a-z-])rtk-engine v'
            exit 1
          fi
          echo "Apache-2.0 edition links no BUSL crate."

  test:
    timeout-minutes: 45
    name: test (${{ matrix.os }}${{ matrix.target && format(', {0}', matrix.target) || '' }})
    needs: clippy
    runs-on: ${{ matrix.os }}
    env:
      # An explicit target on every leg keeps the run command the same. It also puts
      # each leg in cross mode, where RUSTFLAGS no longer reach build scripts or proc-macros.
      CARGO_BUILD_TARGET: ${{ matrix.target || 'host-tuple' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # Links with MinGW's ld, which link.exe's `/STACK:` spelling breaks (see build.rs).
          # The runner's host stays msvc, so build.rs also runs with host != target.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install required search tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep grep
      - name: Install required search tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep grep
          echo "$(brew --prefix grep)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install required search tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ripgrep --yes --no-progress
          "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Verify required search capabilities
        shell: bash
        run: |
          set -e
          grep --version
          rg --version
          rg --pcre2-version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # The fish-script wrap is skipped without a resolvable `fish`, so without
      # this step `tests/fish_wrap_test.rs` asserts only the disabled path and
      # the feature's own code never runs on any runner. Windows has no wrap to
      # exercise: it is disabled there by design.
      - name: Install fish (wrap coverage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Install fish (wrap coverage)
        if: runner.os == 'macOS'
        run: brew install fish
        # `--all` is `--workspace`: `rtk` + `engine`. `proxy/` is tested in
        # its own job, since it is not a member. On a develop push the Linux
        # leg only builds the tests, for the cache pull requests restore:
        # coverage.yml runs the same tests then.
      - name: Install the pinned cargo-nextest
        if: runner.os != 'Linux' || github.event_name != 'push'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.150
          fallback: none
      - if: runner.os != 'Linux' || github.event_name != 'push'
        run: cargo nextest run --locked --workspace --no-fail-fast
      - name: Check the proxy's bundled SQLite on native macOS and Windows
        if: github.event_name == 'pull_request' && runner.os != 'Linux' && !matrix.target
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA"...HEAD -- proxy/Cargo.toml proxy/Cargo.lock proxy/compat proxy/src/store.rs proxy/src/memory.rs proxy/tests/sqlite_stores.rs; then
            exit 0
          fi
          cargo nextest run --locked --manifest-path proxy/Cargo.toml --test sqlite_stores
      - if: runner.os == 'Linux' && github.event_name == 'push'
        run: cargo test --all --no-run

  install-ps1:
    timeout-minutes: 10
    name: install.ps1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # On Windows on Arm the x86_64 release runs under x64 emulation.
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1
      # The published release, installed on this clean runner by both routes.
      - name: Live install, Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install-live.ps1
      - name: Live install, PowerShell 7
        shell: pwsh
        run: ./scripts/test-install-live.ps1

  # The published release installed through a TLS-inspecting proxy and an
  # authenticating one, each set as the system proxy on this disposable runner.
  install-ps1-proxy:
    timeout-minutes: 15
    name: install.ps1 behind proxies
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mitmproxy 12.3.1, checked by SHA-256
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mitmproxy.zip'
          Invoke-WebRequest -Uri 'https://downloads.mitmproxy.org/12.3.1/mitmproxy-12.3.1-windows-x86_64.zip' -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($hash -ne '336C03E7215876AF329F57C44B1B738CFB22CD29DC7CD4C0714F15C7648AF829') { throw "mitmproxy zip SHA-256 $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'mitmproxy'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "MITMDUMP=$dir\mitmdump.exe" >> $env:GITHUB_ENV
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install-proxy.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./scripts/test-install-proxy.ps1

  # install.sh's archive path traversal check (issue #1250, CWE-22).
  install-sh:
    timeout-minutes: 5
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Path traversal check
        run: sh scripts/test-install.sh

  # The agent plugins' own tests. Windows matters: there a program started by
  # bare name runs from the working folder first, which the plugins must avoid.
  hook-plugins:
    timeout-minutes: 10
    name: hook plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: OpenClaw, Pi and OpenCode
        run: node --test openclaw/index.test.mjs hooks/pi/rtk.test.mjs hooks/opencode/rtk.test.mjs
      - name: Hermes
        run: python hooks/hermes/tests/test_rtk_rewrite_plugin.py

  security:
    timeout-minutes: 30
    name: Security Scan
    needs: clippy
    runs-on: ubuntu-latest
    # The diff steps compare with the pull request's base branch. This fork's master is far behind
    # develop, so a diff against it reported the whole fork as every pull request's change.
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # clippy's cache, as in rustdoc: this job runs the same clippy build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: false

      - name: Install the pinned cargo-audit
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Cargo Audit (CVE check)
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          if cargo audit 2>&1 | tee audit.log; then
            echo "No known vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "Vulnerabilities found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Dependency vulnerabilities detected - review required"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # The diff steps review a pull request's changes; a push to develop was reviewed as one.
      - name: Critical files check
        if: github.event_name == 'pull_request'
        run: |
          echo "### Critical Files Modified" >> $GITHUB_STEP_SUMMARY
          CRITICAL=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -E "(runner|summary|tracking|init|pnpm_cmd|container)\.rs|Cargo\.toml|workflows/.*\.yml" || true)
          if [ -n "$CRITICAL" ]; then
            echo "**HIGH RISK**: The following critical files were modified:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required Actions:**" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Manual security review by 2 maintainers" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Verify no shell injection vectors" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Check input validation remains intact" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Critical RTK files modified - enhanced review required"
          else
            echo "No critical files modified" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Dangerous patterns scan
        if: github.event_name == 'pull_request'
        run: |
          echo "### Dangerous Code Patterns" >> $GITHUB_STEP_SUMMARY
          PATTERNS=$(git diff "origin/$BASE_REF...HEAD" | grep -E "Command::new\(\"sh\"|Command::new\(\"bash\"|\.env\(\"LD_PRELOAD|\.env\(\"PATH|reqwest::|std::net::|TcpStream|UdpSocket|unsafe \{|\.unwrap\(\) |panic!\(|todo!\(|unimplemented!\(" || true)
          if [ -n "$PATTERNS" ]; then
            echo "**Potentially dangerous patterns detected:**" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            echo "$PATTERNS" | head -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Security Concerns:**" >> $GITHUB_STEP_SUMMARY
            echo "$PATTERNS" | grep -q "Command::new" && echo "- Shell command execution detected" >> $GITHUB_STEP_SUMMARY || true
            echo "$PATTERNS" | grep -q "\.env\(\"" && echo "- Environment variable manipulation" >> $GITHUB_STEP_SUMMARY || true
            echo "$PATTERNS" | grep -q "reqwest::\|std::net::\|TcpStream\|UdpSocket" && echo "- Network operations added" >> $GITHUB_STEP_SUMMARY || true
            echo "$PATTERNS" | grep -q "unsafe" && echo "- Unsafe code blocks" >> $GITHUB_STEP_SUMMARY || true
            echo "$PATTERNS" | grep -q "\.unwrap\(\)\|panic!\(" && echo "- Panic-inducing code" >> $GITHUB_STEP_SUMMARY || true
            echo "::warning::Dangerous code patterns detected - manual review required"
          else
            echo "No dangerous patterns detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: New dependencies check
        if: github.event_name == 'pull_request'
        run: |
          echo "### Dependencies Changes" >> $GITHUB_STEP_SUMMARY
          if git diff "origin/$BASE_REF...HEAD" Cargo.toml | grep -E "^\+.*=" | grep -v "^\+\+\+" > new_deps.txt; then
            echo "**New dependencies added:**" >> $GITHUB_STEP_SUMMARY
            echo '```toml' >> $GITHUB_STEP_SUMMARY
            cat new_deps.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required Actions:**" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Audit each new dependency on crates.io" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Check maintainer reputation and download counts" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Verify no typosquatting (e.g., 'reqwest' vs 'request')" >> $GITHUB_STEP_SUMMARY
            echo "::warning::New dependencies require supply chain audit"
          else
            echo "No new dependencies added" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Clippy security lints
        run: |
          echo "### Clippy Security Lints" >> $GITHUB_STEP_SUMMARY
          if cargo clippy --workspace --all-targets -- -W clippy::unwrap_used -W clippy::panic -W clippy::expect_used 2>&1 | tee clippy.log | grep -E "warning:|error:"; then
            echo "Security-related lints triggered:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "warning:|error:" clippy.log | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Clippy security lints failed"
          else
            echo "All security lints passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Summary verdict
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Review Verdict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**This is an automated security scan. A human maintainer must:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review all warnings above" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify PR intent matches actual code changes" >> $GITHUB_STEP_SUMMARY
          echo "3. Check for subtle backdoors or logic bombs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**For high-risk PRs (critical files modified):**" >> $GITHUB_STEP_SUMMARY
          echo "- Require approval from 2 maintainers" >> $GITHUB_STEP_SUMMARY
          echo "- Test in isolated environment before merge" >> $GITHUB_STEP_SUMMARY

  semgrep:
    timeout-minutes: 30
    name: semgrep security scan
    # It scans only what a pull request changes since its base.
    if: github.event_name == 'pull_request'
    needs: clippy
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # `--error` alone fails on any finding at any severity, so the rules
      # below .semgrep.yml's "non-blocking, flag for review" divider would block too.
      # Gate on ERROR; report WARNING without failing, as that divider promises.
      - run: semgrep scan --config .semgrep.yml --baseline-commit ${{ github.event.pull_request.base.sha }} --severity ERROR --error
      - run: semgrep scan --config .semgrep.yml --baseline-commit ${{ github.event.pull_request.base.sha }} --severity WARNING || true

  benchmark:
    timeout-minutes: 30
    name: benchmark
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      # The Linux test leg's cache holds this debug build's dependencies; reuse
      # it rather than saving a copy of our own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false

      # Only output tokens are measured, so a release build would only add time.
      - name: Build rtk
        run: cargo build --locked

      - name: Install system tools
        run: sudo apt-get install -y tree ripgrep

      - name: Install Python tools
        run: pip install --only-binary ':all:' --require-hashes --requirement .github/ci/benchmark-requirements.txt

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "stable"

      - name: Install Go tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      # tools/dev is its own workspace, so the workspace jobs do not see it. Its
      # parity test replays the cases recorded from the shell benchmark it replaced.
      # Its build goes outside the checkout: the raw `find .` rows would count it.
      - name: Lint and test the benchmark tool
        run: |
          cargo fmt --manifest-path tools/dev/Cargo.toml --check
          cargo clippy --manifest-path tools/dev/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path tools/dev/Cargo.toml --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rtk-dev-target

      # Built, then run directly: `cargo run` would add its CARGO_* variables to
      # the environment the env rows measure.
      - name: Run benchmark
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/rtk-dev-target" cargo build --manifest-path tools/dev/Cargo.toml --locked
          "$RUNNER_TEMP/rtk-dev-target/debug/rtk-dev" benchmark
        env:
          RTK_BIN: target/debug/rtk

  # The one PR job building the shipped profile: LTO problems only show at this link.
  release:
    name: release (build)
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - run: cargo build --locked --release
