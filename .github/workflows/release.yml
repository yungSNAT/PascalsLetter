name: Release

# Builds the Apache-2.0 edition of rtk (`rtk-oss`, --no-default-features) for
# 5 targets. A `fork-v*` tag also gets checksums.txt, a signed build
# provenance attestation and a DRAFT release holding them; a maintainer
# reviews the draft and publishes it. A pull request that changes this file
# runs every job except the draft, as a dry run.
#
# Only the Apache-2.0 edition ships until it is settled whether the BUSL-1.1
# grant in engine/LICENSE covers a binary RTK AI Labs did not build, so
# rtk-proxy (BUSL-1.1) is not shipped either. Asset names and checksums.txt
# follow upstream's `rtk-oss` assets, which install.sh fetches.

on:
  push:
    tags: ["fork-v*"]
  pull_request:
    branches: [develop]
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each target builds on a runner that can execute it, so every archive's
        # binary is run before it is packaged.
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-2025, archive: zip }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-15, archive: tar.gz }
    env:
      TARGET: ${{ matrix.target }}
      ASSET: rtk-oss-${{ matrix.target }}.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The static C runtime lets rtk.exe run without the Visual C++
      # redistributable. With --target, RUSTFLAGS skips build scripts. For
      # aarch64 musl the cc crate wants aarch64-linux-musl-gcc, which Ubuntu's
      # musl-tools lacks; on the arm runner its musl-gcc builds for aarch64.
      - name: Build the Apache-2.0 edition
        shell: bash
        env:
          RUSTFLAGS: ${{ endsWith(matrix.target, '-msvc') && '-C target-feature=+crt-static' || '' }}
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --no-default-features --target "$TARGET"

      - name: Require a static C runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          readobj="$(cygpath -u "$(rustc --print sysroot)")/lib/rustlib/$(rustc --print host-tuple)/bin/llvm-readobj.exe"
          imports=$("$readobj" --coff-imports "target/$TARGET/release/rtk.exe" | grep 'Name: ')
          echo "$imports"
          if grep -iE 'vcruntime|msvcp|ucrtbase|api-ms-win-crt' <<<"$imports"; then
            echo "::error::rtk.exe imports a C runtime DLL"
            exit 1
          fi

      - name: Check the version and package the archive
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          exe=rtk
          if [ "$RUNNER_OS" = Windows ]; then exe=rtk.exe; fi
          out=$("target/$TARGET/release/$exe" --version)
          echo "$out"
          case "$out" in
            "rtk "?*) version=${out#rtk } ;;
            *) echo "::error::unexpected --version output: $out"; exit 1 ;;
          esac
          # The version is upstream's, plus `+pascalsletter` for the first
          # release on it and `+pascalsletter.N` for the next ones. The tag is
          # fork-v<upstream>, then -N: 1.2.0+pascalsletter.1 is fork-v1.2.0-1.
          if [[ $version =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+pascalsletter(\.([1-9][0-9]*))?$ ]]; then
            expected="fork-v${BASH_REMATCH[1]}${BASH_REMATCH[3]:+-${BASH_REMATCH[3]}}"
          else
            echo "::error::rtk $version is not <upstream>+pascalsletter or <upstream>+pascalsletter.N"
            exit 1
          fi
          echo "release tag for this version: $expected"
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "$expected" ]; then
            echo "::error::tag $TAG does not match rtk $version; expected $expected"
            exit 1
          fi
          mkdir pkg
          cp "target/$TARGET/release/$exe" LICENSE NOTICE pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            (cd pkg && 7z a "../$ASSET" "$exe" LICENSE NOTICE)
          else
            tar -czf "$ASSET" -C pkg "$exe" LICENSE NOTICE
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rtk-oss-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rtk-oss-*
          path: dist
          merge-multiple: true

      - name: Require exactly the 5 archives and write checksums.txt
        working-directory: dist
        run: |
          set -euo pipefail
          printf '%s\n' * | LC_ALL=C sort | diff - <(printf '%s\n' \
            rtk-oss-aarch64-apple-darwin.tar.gz \
            rtk-oss-aarch64-unknown-linux-musl.tar.gz \
            rtk-oss-x86_64-apple-darwin.tar.gz \
            rtk-oss-x86_64-pc-windows-msvc.zip \
            rtk-oss-x86_64-unknown-linux-musl.tar.gz)
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  draft:
    name: draft release
    needs: checksums
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # The only job with write scopes. It runs no repository code.
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      # Checked just before the 2 writes (attestation and draft) so that what
      # they name is what was built.
      - name: Require the tag to name the built commit, on develop, with no release yet
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag may have been moved since this run started.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          sha=${ref#* }
          echo "tag-object=$sha" >> "$GITHUB_OUTPUT"
          if [ "${ref%% *}" = tag ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now names $sha, not the built commit $GITHUB_SHA"
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$GITHUB_SHA is not on develop (compare status: $status)"; exit 1 ;;
          esac
          # A rerun must not add a second draft for the same tag. The list
          # includes drafts, and a failed lookup stops the job.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -qxF -- "$TAG" <<< "$tags"; then
            echo "::error::a release for $TAG already exists"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # The tag can still move between the check and the draft. A move before
      # the draft stops it; a move whilst it is made fails the run, so the
      # draft is not published as is. A ruleset blocking updates to fork-v*
      # tags would prevent the move itself.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ steps.guard.outputs.tag-object }}
        run: |
          set -euo pipefail
          unmoved() {
            [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$TAG_OBJECT" ]
          }
          # The notes list the pull requests merged since the latest published
          # release, after the text below.
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if ! unmoved; then
            echo "::error::$TAG moved after the check; no draft was made"
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "PascalsLetter ${TAG#fork-v}" \
            --generate-notes --notes-start-tag "$previous" \
            --notes "The Apache-2.0 edition of rtk (\`rtk-oss\`), built from $TAG. Check an archive against \`checksums.txt\`, and its provenance with \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`."
          if ! unmoved; then
            echo "::error::$TAG moved whilst its draft was made; delete the draft, which may name another commit"
            exit 1
          fi
