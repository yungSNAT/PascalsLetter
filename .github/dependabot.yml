version: 2
updates:
  - package-ecosystem: "cargo"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release is not proposed until it is 7 days old, so a bad or compromised
    # one has time to be found and yanked. Security updates are not delayed.
    cooldown:
      default-days: 7
    # One pull request per ecosystem and week, not one per package.
    groups:
      cargo:
        patterns:
          - "*"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  # The ccusage release the npx fallback runs (src/analytics/ccusage.rs).
  - package-ecosystem: "npm"
    target-branch: "develop"
    directory: "/src/analytics/ccusage-pin"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "area:ci"

  # The benchmark job's Python tools, pinned by hash in benchmark-requirements.txt.
  - package-ecosystem: "pip"
    target-branch: "develop"
    directory: "/.github/ci"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns:
          - "*"
    labels:
      - "dependencies"
